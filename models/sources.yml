version: 2

sources:
  - name: eth
    database: eth
    schema: eth_schema    
    config: 
      freshness: # default freshness
        # changed to config in v1.9
        warn_after: {count: 12, period: hour}
        error_after: {count: 45, period: day}
      loaded_at_field: to_timestamp(date) # changed to config in v1.10    
    tables:
      - name: contracts
      - name: token_transfers
      - name: transactions
      - name: contracts_clone