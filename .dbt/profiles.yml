eth:
  outputs:
    ci:
      account: "{{ env_var(secrets.DBT_SNOWFLAKE_IDENTIFIER) }}"
      database: ci
      private_key_path: "{{ env_var('DBT_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var(secrets.DBT_SNOWFLAKE_ROLE) }}"
      schema: ci_schema
      threads: 1
      type: snowflake
      user: "{{ env_var(secrets.DBT_SNOWFLAKE_USER) }}"
      warehouse: COMPUTE_WH
  target: dev
